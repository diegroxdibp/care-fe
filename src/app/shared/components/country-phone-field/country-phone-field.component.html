<div class="phone-field-root">
  <div class="phone-input-wrap" [class.is-error]="invalid">
    <button
      type="button"
      class="dial-code"
      [class.open]="dropdownOpen()"
      [attr.aria-expanded]="dropdownOpen()"
      aria-haspopup="listbox"
      (click)="toggleDropdown()"
    >
      <span>+{{ prefixCountry().InternationalAreaCode }}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="input-cell">
      <input
        [id]="inputId"
        type="tel"
        [formControl]="phoneControl"
        [maskito]="phoneMask"
        [placeholder]="placeholder"
      />
    </div>
  </div>

  @if (dropdownOpen()) {
    <div class="prefix-dropdown" role="listbox">
      <input
        #searchInput
        type="text"
        class="dropdown-search"
        placeholder="Buscar país..."
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />
      <div class="prefix-options">
        @for (c of filteredCountries(); track c.code) {
          <button
            type="button"
            class="prefix-option"
            role="option"
            [class.selected]="c.code === prefixCountry().code"
            [attr.aria-selected]="c.code === prefixCountry().code"
            (click)="selectPrefixCountry(c)"
          >
            <span class="option-name">{{ c.namePt }}</span>
            <span class="option-code">+{{ c.InternationalAreaCode }}</span>
          </button>
        } @empty {
          <div class="no-results">Nenhum país encontrado</div>
        }
      </div>
    </div>
  }
</div>
