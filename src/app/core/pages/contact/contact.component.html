<div class="section">
  <form class="contact-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="card-head">
      <h1 class="card-title">Contato</h1>
      <p class="card-sub">Tire suas dúvidas, envie-nos uma mensagem:</p>
    </div>
    <div class="card-divider"></div>

    <div class="card-body">
      <div class="field" [class.is-error]="isError('nome')">
        <label for="nome" class="field-label">Nome:</label>
        <input id="nome" type="text" class="field-input" formControlName="nome" placeholder="Seu nome" />
      </div>

      @if (!isAuthenticated()) {
        <div class="field" [class.is-error]="isError('email')">
          <label for="c-email" class="field-label">Email:</label>
          <input id="c-email" type="email" class="field-input" formControlName="email" placeholder="seu@email.com" autocomplete="email" />
        </div>

        <div class="phone-row">
          <div class="field country-field">
            <label id="c-country-label" class="field-label">País:</label>
            <app-styled-select
              inputId="c-country"
              [options]="countryOptions"
              [value]="selectedCountry.code"
              (valueChange)="onCountryChange($event)"
            />
          </div>

          <div class="field phone-field" [class.is-error]="isError('telefone')">
            <label for="c-phone" class="field-label">Telefone:</label>
            <app-country-phone-field
              [country]="selectedCountry"
              [phoneControl]="telefoneCtrl"
              [invalid]="isError('telefone')"
              inputId="c-phone"
              placeholder="912 345 678"
              (prefixCountryChange)="onPhonePrefixChange($event)"
            />
          </div>
        </div>
      }

      <div class="field" [class.is-error]="isError('assunto')">
        <label for="assunto" class="field-label">Assunto:</label>
        <input id="assunto" type="text" class="field-input" formControlName="assunto" placeholder="Sobre o que gostaria de falar?" />
      </div>

      <div class="field" [class.is-error]="isError('mensagem')">
        <label for="mensagem" class="field-label">Mensagem:</label>
        <textarea id="mensagem" class="field-input" formControlName="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>
      </div>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <button type="submit" class="enviar-btn" [class.is-sent]="sent" [disabled]="sending">
        @if (sent) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Mensagem enviada</span>
        } @else if (sending) {
          <span>Enviando...</span>
        } @else {
          <span>ENVIAR</span>
        }
      </button>

      <div class="card-fineprint">
        <p>
          Ao enviar o email, aceito os
          <a [routerLink]="'/' + Pages.TERMOS_USO">termos de uso</a>
          e a
          <a [routerLink]="'/' + Pages.POLITICA_PRIVACIDADE">política de privacidade</a>.
        </p>
        <p>Se você quer agendar algum serviço, clique <button type="button" class="link-btn" (click)="goToScheduling()"><strong>aqui</strong></button>.</p>
      </div>
    </div>
  </form>
</div>
