<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Care - Clínica Ampliada Resignificações</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A Care só tem tema claro. Sem esta declaração, o Auto Dark Theme do
         Chrome (Android, por omissão) e equivalentes invertem a página por
         heurística: escurecem fundos e texto, mas deixam intactos os SVG com
         cores fixas, as fotografias e os gradientes — o resultado é um misto
         ilegível. "only light" desliga essa inversão. Está no <head> (e não só
         no CSS) para valer já no primeiro paint. Se algum dia existir tema
         escuro a sério, é isto que tem de sair primeiro. -->
    <meta name="color-scheme" content="only light" />
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Care" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <!-- Preload the most-used weights of the self-hosted body font (used by every h1/h2/p/a/nav-item on first paint) -->
    <link
      rel="preload"
      href="/assets/font/SourceSans3-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/font/SourceSans3-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/font/SourceSans3-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- display=block (not swap): this is a ligature icon font — its raw text
         content (e.g. "expand_more") is only ever meant to be read as a glyph,
         never as literal words, so briefly showing nothing while it loads
         beats briefly showing the ligature name spelled out. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!-- .material-symbols-outlined spans stay invisible (styles.scss) until
         this confirms the font is ready or has given up, so raw ligature
         text (e.g. "expand_more") is never shown. -->
    <script>
      (function () {
        var reveal = function () { document.documentElement.classList.add('icons-ready'); };
        if (document.fonts && document.fonts.load) {
          document.fonts.load('24px "Material Symbols Outlined"').then(reveal, reveal);
          setTimeout(reveal, 2000); // never hide icons indefinitely if the check hangs
        } else {
          reveal();
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
