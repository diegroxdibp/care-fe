<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Care - Clínica Ampliada Ressignificações</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Quem lê a página sem correr JavaScript (pré-visualizações de links no
         WhatsApp/LinkedIn, assistentes de IA, alguns motores de busca) só vê
         este ficheiro. Estas tags e o noscript no fim do body são o que essas
         ferramentas encontram. Servem para todas as rotas, por isso não há
         og:url nem link canonical: apontariam toda a partilha para a
         home. Quando houver pré-renderização, cada página terá as suas. -->
    <meta
      name="description"
      content="Care é uma clínica ampliada de cuidado em saúde mental, relacional, física e social. Atendimento individual e em grupo, remoto ou presencial, em Portugal e no Brasil."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Care" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Care - Clínica Ampliada Ressignificações" />
    <meta
      property="og:description"
      content="Uma clínica ampliada de cuidado em saúde mental, relacional, física e social. Atendimento individual e em grupo, remoto ou presencial, em Portugal e no Brasil."
    />
    <meta
      property="og:image"
      content="https://careclinica.com/assets/favicon/web-app-manifest-512x512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logótipo da Care" />
    <meta name="twitter:card" content="summary" />
    <!-- A Care só tem tema claro. Sem esta declaração, o Auto Dark Theme do
         Chrome (Android, por omissão) e equivalentes invertem a página por
         heurística: escurecem fundos e texto, mas deixam intactos os SVG com
         cores fixas, as fotografias e os gradientes — o resultado é um misto
         ilegível. "only light" desliga essa inversão. Está no <head> (e não só
         no CSS) para valer já no primeiro paint. Se algum dia existir tema
         escuro a sério, é isto que tem de sair primeiro. -->
    <meta name="color-scheme" content="only light" />
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Care" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <!-- Preload the most-used weights of the self-hosted body font (used by every h1/h2/p/a/nav-item on first paint) -->
    <link
      rel="preload"
      href="/assets/font/SourceSans3-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/font/SourceSans3-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/font/SourceSans3-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- display=block (not swap): this is a ligature icon font — its raw text
         content (e.g. "expand_more") is only ever meant to be read as a glyph,
         never as literal words, so briefly showing nothing while it loads
         beats briefly showing the ligature name spelled out. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!-- .material-symbols-outlined spans stay invisible (styles.scss) until
         this confirms the font is ready or has given up, so raw ligature
         text (e.g. "expand_more") is never shown. -->
    <script>
      (function () {
        var reveal = function () { document.documentElement.classList.add('icons-ready'); };
        if (document.fonts && document.fonts.load) {
          document.fonts.load('24px "Material Symbols Outlined"').then(reveal, reveal);
          setTimeout(reveal, 2000); // never hide icons indefinitely if the check hangs
        } else {
          reveal();
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <!-- Versão em texto da home, para quem não corre JavaScript (ver o
         comentário das meta tags no <head>). O texto vem das secções da home
         (hero, pilares, como-funciona, confianca): se mudar lá, mude aqui. -->
    <noscript>
      <main class="noscript-fallback">
        <h1>Care - Clínica Ampliada Ressignificações</h1>
        <p>
          Uma clínica ampliada de cuidado em saúde mental, relacional, física e
          social. Comprometida com a ressignificação das perspectivas e práticas
          em saúde.
        </p>
        <p>
          Atendimento remoto ou presencial (Portugal e Brasil), conforme a
          modalidade do serviço escolhido.
        </p>

        <h2>Os quatro pilares</h2>
        <ul>
          <li><strong>Cuidado Centrado na Pessoa:</strong> cada plano de cuidado é único e feito para a pessoa, não para um protocolo.</li>
          <li><strong>Abordagem Integral:</strong> corpo, vivências e vínculos entram na mesma sala. Todos são protagonistas.</li>
          <li><strong>Trabalho Transdisciplinar:</strong> abordagem que supera a fragmentação dos saberes e os integra em diálogo.</li>
          <li><strong>Modelo Biopsicossocial:</strong> saúde como estado de bem viver e não como ausência de doença.</li>
        </ul>

        <h2>Como funciona</h2>
        <ol>
          <li><strong>Escolha o serviço e a pessoa profissional.</strong> Veja as abordagens disponíveis e para quem cada uma se destina antes de decidir.</li>
          <li><strong>Veja a agenda completa.</strong> Datas, horários, modalidade de atendimento e valor aparecem antes da confirmação.</li>
          <li><strong>Confirme e acompanhe pelo perfil.</strong> Cancelar, reagendar e revisar seus atendimentos ficam no mesmo lugar.</li>
        </ol>

        <h2>Páginas</h2>
        <ul>
          <li><a href="/#services">Serviços</a></li>
          <li><a href="/about">Sobre a Care</a></li>
          <li><a href="/junte-se">Junte-se a nós</a></li>
          <li><a href="/contact">Contato</a></li>
        </ul>

        <p>Para agendar um atendimento, ative o JavaScript no seu navegador.</p>
      </main>
    </noscript>
  </body>
</html>
